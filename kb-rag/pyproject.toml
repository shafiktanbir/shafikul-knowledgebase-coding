[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kb-rag"
version = "0.1.0"
description = "Local RAG indexing layer for Shafikul's Markdown knowledge base"
requires-python = ">=3.12"
dependencies = [
    "click>=8.1",
    "rich>=13.0",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "sqlite-vec>=0.1.1",
    "google-generativeai>=0.8",
    "tiktoken>=0.7",
    "openai>=1.0",
    "anthropic>=0.30",
]

[project.scripts]
kb = "kb.cli:cli"

[tool.setuptools.packages.find]
where = ["src"]
